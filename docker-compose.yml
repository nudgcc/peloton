services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: peloton
      POSTGRES_PASSWORD: peloton
      POSTGRES_DB: peloton
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peloton"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
